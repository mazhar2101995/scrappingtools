version: '3.8'

services:
  # 1. Reverse Proxy Gateway (Nginx / External Entrypoint)
  gateway:
    image: nginx:alpine
    container_name: saas_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dashboard
      - api
    networks:
      - saas_staging_net

  # 2. Frontend Next.js 14 Dashboard
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: saas_dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${STAGING_DOMAIN:-staging.yourdomain.com}/api/v1
    expose:
      - "3000"
    networks:
      - saas_staging_net

  # 3. Core REST API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saas_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-saas_staging_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-product_intelligence_staging}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SCRAPING_SERVICE_URL=http://scraping-engine:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraping-engine:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - saas_staging_net

  # 4. Python FastAPI Scraping Engine
  scraping-engine:
    build:
      context: ./services/scraping-engine
      dockerfile: Dockerfile
    container_name: saas_scraping_engine
    restart: unless-stopped
    environment:
      - PORT=8001
      - PYTHONPATH=/app
    expose:
      - "8001"
    networks:
      - saas_staging_net

  # 5. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: saas_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-product_intelligence_staging}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_staging_user} -d ${POSTGRES_DB:-product_intelligence_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_staging_net

  # 6. Redis Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: saas_staging_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_staging_net

volumes:
  staging_postgres_data:
  staging_redis_data:

networks:
  saas_staging_net:
    driver: bridge

